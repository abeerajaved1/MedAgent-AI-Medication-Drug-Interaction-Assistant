<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedAgent — Medication Information & Interaction Checker</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .msg-enter { animation: fadeIn 0.25s ease-out; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(4px);} to {opacity:1; transform: translateY(0);} }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
</style>
</head>
<body class="bg-slate-50 h-screen flex flex-col">

  <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center gap-3">
    <div class="w-9 h-9 rounded-lg bg-teal-600 flex items-center justify-center text-white font-bold">M</div>
    <div>
      <h1 class="font-semibold text-slate-800">MedAgent</h1>
      <p class="text-xs text-slate-500">AI Agent-based medication information & drug interaction checker</p>
    </div>
  </header>

  <div class="bg-amber-50 border-b border-amber-200 text-amber-800 text-xs px-6 py-2">
    ⚠️ Informational tool only — not a substitute for professional medical advice. Always consult a doctor or pharmacist.
  </div>

  <main id="chat" class="flex-1 overflow-y-auto px-6 py-4 space-y-4 max-w-3xl mx-auto w-full"></main>

  <footer class="border-t border-slate-200 bg-white p-4">
    <div class="max-w-3xl mx-auto flex gap-2">
      <input id="input" type="text" placeholder="e.g. Can Warfarin and Aspirin be taken together?"
        class="flex-1 border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm">
      <button id="send" class="bg-teal-600 hover:bg-teal-700 text-white px-5 py-2 rounded-lg text-sm font-medium">Send</button>
    </div>
    <div class="max-w-3xl mx-auto flex gap-2 mt-2 flex-wrap">
      <button class="example text-xs bg-slate-100 hover:bg-slate-200 rounded-full px-3 py-1 text-slate-600">What is Ibuprofen used for?</button>
      <button class="example text-xs bg-slate-100 hover:bg-slate-200 rounded-full px-3 py-1 text-slate-600">Can Warfarin and Aspirin be taken together?</button>
      <button class="example text-xs bg-slate-100 hover:bg-slate-200 rounded-full px-3 py-1 text-slate-600">Side effects of Sertraline?</button>
    </div>
  </footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

function statusBadge(status) {
  const map = {
    approved: ['bg-green-100 text-green-700', 'Approved'],
    warning: ['bg-amber-100 text-amber-700', 'Warning'],
    insufficient_evidence: ['bg-red-100 text-red-700', 'Insufficient Evidence'],
  };
  const [cls, label] = map[status] || ['bg-slate-100 text-slate-700', status];
  return `<span class="text-xs font-medium px-2 py-0.5 rounded-full ${cls}">${label}</span>`;
}

function addUserMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg-enter flex justify-end';
  div.innerHTML = `<div class="bg-teal-600 text-white rounded-2xl rounded-br-sm px-4 py-2 max-w-[80%] text-sm">${escapeHtml(text)}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addLoading() {
  const div = document.createElement('div');
  div.id = 'loading';
  div.className = 'msg-enter flex justify-start';
  div.innerHTML = `<div class="bg-white border border-slate-200 rounded-2xl rounded-bl-sm px-4 py-3 text-sm text-slate-400">MedAgent is checking sources…</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeLoading() {
  document.getElementById('loading')?.remove();
}

function addAgentMessage(data) {
  const div = document.createElement('div');
  div.className = 'msg-enter flex justify-start';
  const sourcesHtml = (data.sources || []).slice(0, 4).map(s =>
    `<div class="text-xs text-slate-500 border-l-2 border-slate-200 pl-2 mt-1"><span class="font-medium">${escapeHtml(s.source)}</span> — ${escapeHtml(s.snippet)}</div>`
  ).join('');

  div.innerHTML = `
    <div class="bg-white border border-slate-200 rounded-2xl rounded-bl-sm px-4 py-3 max-w-[85%] text-sm space-y-2">
      <div class="flex items-center gap-2 flex-wrap">
        ${statusBadge(data.verification_status)}
        <span class="text-xs text-slate-400">intent: ${escapeHtml(data.query_type)}</span>
      </div>
      <p class="text-slate-800 whitespace-pre-wrap">${escapeHtml(data.explanation)}</p>
      <div class="bg-slate-50 rounded-lg p-2 text-xs text-slate-600">🛈 ${escapeHtml(data.safety_note)}</div>
      ${sourcesHtml ? `<details class="text-xs"><summary class="cursor-pointer text-teal-700">Sources</summary>${sourcesHtml}</details>` : ''}
      <p class="text-[11px] text-slate-400 pt-1 border-t border-slate-100">${escapeHtml(data.disclaimer)}</p>
    </div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.innerText = str ?? '';
  return d.innerHTML;
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  addUserMessage(text);
  input.value = '';
  addLoading();
  sendBtn.disabled = true;
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    removeLoading();
    if (!res.ok) {
      addAgentMessage({ explanation: 'Something went wrong: ' + (data.detail || res.statusText),
        safety_note: '', verification_status: 'insufficient_evidence', query_type: 'error', disclaimer: '' });
    } else {
      addAgentMessage(data);
    }
  } catch (e) {
    removeLoading();
    addAgentMessage({ explanation: 'Network error: ' + e.message, safety_note: '',
      verification_status: 'insufficient_evidence', query_type: 'error', disclaimer: '' });
  }
  sendBtn.disabled = false;
}

sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
document.querySelectorAll('.example').forEach(btn => {
  btn.addEventListener('click', () => { input.value = btn.textContent; sendMessage(); });
});
</script>
</body>
</html>
